[package]
name = "vectorium"
version = "0.1.0"
edition = "2024"
authors = [
    "Rossano Venturini <rossano.venturini@unipi.it>"]
readme = "README.md"
description = "Dense and sparse embedding datasets with compression utilities and brute-force parallel search."
license = "MIT"

[dependencies]
indicatif = { version = "0.17.11", features = ["rayon"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0", features = ["serde"] }
clap = { version = "4.5", features = ["derive"], optional = true }
rayon = "1.11"
# TODO: f16 available in nightly, but not supported by crates: https://github.com/rust-num/num-traits/pull/333
half = { version = "2.6", features = [
    "bytemuck",
    "serde",
    "std",
    "num-traits",
] }
ndarray = "0.16"
ndarray-npy = "0.9"
# TODO: use upstream when https://gitlab.com/tspiteri/fixed/-/issues/69 is fixed
# If it's not getting fixed, prefer using a git patch when https://github.com/rust-lang/cargo/issues/4648 is fixed
fixed = { git = "https://gitlab.com/tinozzo123/fixed", branch = "fast_to_f32_hack", features = [
    "num-traits",
    "serde",
] }
num-traits = "0.2.19"
itertools = "0.14.0"
bytemuck = { version = "1.23", features = [
    "min_const_generics",
] }
rusty-perm = "0.2.0"
# Pinned: upstream renamed the package `rgb` -> `rgbisect` on `main` HEAD, so an unpinned
# dep fails to resolve downstream ("no matching package named `rgb`"). 490205b is the last
# rev exposing the `rgb` crate (rgb::forward::Doc, rgb::recursive_graph_bisection). Do not
# unpin without porting src/utils/utils.rs to the renamed crate's API.
rgb = { git = "https://github.com/JMMackenzie/enhanced-graph-bisection.git", rev = "490205b23869ddbb2d52f0929058da04be3d643d" }
rand = "0.8"
rand_distr = "0.4"
matrixmultiply = "0.3"
# Pinned to the resolved rev for reproducible downstream resolution (avoids floating to the
# repo's default-branch HEAD on `cargo update` -- the failure mode the `rgb` rename caused above).
ckmeans = { git = "https://github.com/urschrei/ckmeans.git", rev = "bad83c763b9db5de7d60cdd66e2f4d2a82026374" }
dsi-bitstream = "0.9.1"

[features]
default = []
# Enables the optional command-line utilities under `src/bin/` that depend on clap/indicatif.
cli = ["dep:clap", "dep:indicatif"]

[[bin]]
name = "compute_groundtruth"
path = "src/bin/compute_groundtruth.rs"
required-features = ["cli"]

[[bin]]
name = "bench_dotvbyte_u32"
path = "src/bin/bench_dotvbyte_u32.rs"
required-features = ["cli"]

[[bin]]
name = "bench_dotvbyte_u16"
path = "src/bin/bench_dotvbyte_u16.rs"
required-features = ["cli"]

[[bin]]
name = "bench_variable_bit_quantization"
path = "src/bin/bench_variable_bit_quantization.rs"
required-features = ["cli"]

[[bin]]
name = "bench_variable_bit_quantization_oversample"
path = "src/bin/bench_variable_bit_quantization_oversample.rs"
required-features = ["cli"]




[[bin]]
name = "bench_centroid_quantization"
path = "src/bin/bench_centroid_quantization.rs"
required-features = ["cli"]

[[bin]]
name = "bench_variable_bit_centroid_quantization"
path = "src/bin/bench_variable_bit_centroid_quantization.rs"
required-features = ["cli"]

[[bin]]
name = "bench_variable_bit_centroid_quantization_oversample"
path = "src/bin/bench_variable_bit_centroid_quantization_oversample.rs"
required-features = ["cli"]

[[bin]]
name = "bench_4bit_efficiency_scalar"
path = "src/bin/bench_4bit_efficiency_scalar.rs"
required-features = ["cli"]

[[bin]]
name = "bench_4bit_efficiency_kmeans"
path = "src/bin/bench_4bit_efficiency_kmeans.rs"
required-features = ["cli"]

[[bin]]
name = "bench_4bit_efficiency_kmeans_f16lut"
path = "src/bin/bench_4bit_efficiency_kmeans_f16lut.rs"
required-features = ["cli"]

[[bin]]
name = "bench_4bit_efficiency_kmeans_clustered"
path = "src/bin/bench_4bit_efficiency_kmeans_clustered.rs"
required-features = ["cli"]

[[bin]]
name = "bench_f16_efficiency"
path = "src/bin/bench_f16_efficiency.rs"
required-features = ["cli"]

[[bin]]
name = "bench_blocked_sparse_vs_f16"
path = "src/bin/bench_blocked_sparse_vs_f16.rs"
required-features = ["cli"]

[[bin]]
name = "bench_all_4_bits"
path = "src/bin/bench_all_4_bits.rs"
required-features = ["cli"]

[[bin]]
name = "dump_kmeans_centroids"
path = "src/bin/dump_kmeans_centroids.rs"
required-features = ["cli"]


[[bin]]
name = "dump_component_values"
path = "src/bin/dump_component_values.rs"
required-features = ["cli"]

[[bin]]
name = "analyze_deltas"
path = "src/bin/analyze_deltas.rs"
required-features = ["cli"]

[[bin]]
name = "analyze_quantization_errors"
path = "src/bin/analyze_quantization_errors.rs"
required-features = ["cli"]



[profile.release]
opt-level = 3
debug = true
lto = true
